# Not So Simple Chat -- local development configuration.

spring.application.name=coffee-chat-application

# Points at a local Postgres instance (or a docker-compose service once one exists).
# Override with SPRING_DATASOURCE_* environment variables for other environments --
# never commit real credentials here.
spring.datasource.url=jdbc:postgresql://localhost:5432/coffee_chat
spring.datasource.username=coffee_chat
spring.datasource.password=coffee_chat

# Part 03: schema is owned by versioned Flyway migrations (src/main/resources/db/migration),
# reviewed as SQL before any entity was written -- not generated from entities. Hibernate only
# validates that the entities match that schema at startup; it never mutates the DB itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Singleton (CoffeeShop): barista pool size, read once at startup. Part 02 sizes the
# @Async barista executor -- and how many consumer loops are started -- from this same value.
coffeeshop.barista-pool-size=3

# Part 02: OrderQueue's bounded capacity (producers block on placeOrder's enqueue once full).
# Matches the reference project's default.
coffeeshop.order-queue-capacity=10
