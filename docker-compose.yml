services:
  db:
    image: postgres:17-alpine
    container_name: coffee-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee_chat
      POSTGRES_USER: coffee_chat
      POSTGRES_PASSWORD: coffee_chat
    ports:
      - "5432:5432"
    volumes:
      - coffee-chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_chat -d coffee_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coffee-chat-db-data:
